<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>進度追蹤庫 - YMDB Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #1e293b; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #64748b; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- 頂部導航列 -->
  <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-layer-group text-sky-400 text-2xl"></i>
        <h1 class="text-xl font-bold tracking-wide">個人追蹤庫</h1>
        <span id="sync-status" class="text-xs px-2.5 py-1 rounded-full bg-slate-800 text-slate-400 border border-slate-700">離線模式</span>
      </div>

      <!-- 設定與 Google 登入按鈕 -->
      <div class="flex items-center space-x-3">
        <button id="btn-config" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-2 rounded-lg border border-slate-700 transition" title="Firebase 專案設定">
          <i class="fa-solid fa-gear mr-1.5"></i>設定
        </button>
        <div id="auth-container">
          <button id="btn-login" class="text-xs bg-sky-600 hover:bg-sky-500 text-white font-semibold px-3.5 py-2 rounded-lg transition flex items-center shadow">
            <i class="fa-brands fa-google mr-2"></i>Google 登入
          </button>
          <div id="user-profile" class="hidden flex items-center space-x-2">
            <img id="user-avatar" class="w-8 h-8 rounded-full border border-slate-700" alt="Avatar">
            <span id="user-name" class="text-xs font-semibold text-slate-200 hidden sm:inline-block max-w-[110px] truncate"></span>
            <button id="btn-logout" class="text-xs bg-slate-800 hover:bg-rose-950 hover:text-rose-400 text-slate-400 p-2 rounded-lg border border-slate-700 transition" title="登出">
              <i class="fa-solid fa-arrow-right-from-bracket"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- 主操作區 -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 flex flex-col gap-4">
    
    <!-- 篩選工具列 -->
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 sm:p-4 flex flex-wrap items-center justify-between gap-3 shadow">
      <div class="flex flex-wrap items-center gap-2.5">
        <select id="filter-type" class="bg-slate-800 text-slate-200 text-sm px-3 py-2 rounded-lg border border-slate-700 focus:outline-none focus:border-sky-500">
          <option value="ALL">全部載體 (影劇 / 漫畫)</option>
          <option value="VIDEO">影劇 / 動畫</option>
          <option value="BOOK">漫畫 / 書籍</option>
        </select>

        <select id="filter-genre" class="bg-slate-800 text-slate-200 text-sm px-3 py-2 rounded-lg border border-slate-700 focus:outline-none focus:border-sky-500">
          <option value="ALL">全部劇種 / 類型</option>
          <option value="日劇">日劇</option>
          <option value="美劇">美劇</option>
          <option value="台劇">台劇</option>
          <option value="其它劇">其它劇</option>
          <option value="動畫">動畫</option>
          <option value="漫畫">漫畫</option>
          <option value="書籍">書籍</option>
        </select>

        <select id="filter-platform" class="bg-slate-800 text-slate-200 text-sm px-3 py-2 rounded-lg border border-slate-700 focus:outline-none focus:border-sky-500">
          <option value="ALL">全部平台</option>
          <option value="Netflix">Netflix</option>
          <option value="Prime Video">Prime Video</option>
          <option value="CatchPlay+">CatchPlay+</option>
          <option value="MyVideo">MyVideo</option>
          <option value="LINE TV">LINE TV</option>
          <option value="Disney+">Disney+</option>
          <option value="動畫瘋">動畫瘋</option>
          <option value="讀墨">讀墨</option>
          <option value="實體書">實體書</option>
          <option value="其它平台">其它平台</option>
        </select>

        <div class="relative">
          <input type="text" id="search-input" placeholder="搜尋作品名稱..." class="bg-slate-800 text-slate-200 text-sm pl-8 pr-3 py-2 rounded-lg border border-slate-700 focus:outline-none focus:border-sky-500 w-44 sm:w-56">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-500 text-sm"></i>
        </div>
      </div>

      <button id="btn-add-item" class="bg-sky-600 hover:bg-sky-500 text-white text-sm font-semibold px-4 py-2 rounded-lg shadow flex items-center transition ml-auto">
        <i class="fa-solid fa-plus mr-1.5"></i>新增紀錄
      </button>
    </div>

    <!-- 橫列表格區 -->
    <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow flex flex-col flex-1">
      <div class="overflow-x-auto custom-scrollbar flex-1">
        <table class="w-full text-left border-collapse text-sm whitespace-nowrap min-w-[860px]">
          <thead>
            <tr class="bg-slate-800/80 border-b border-slate-700/80 text-slate-300 font-semibold text-xs tracking-wider">
              <th class="py-3 px-4 w-24">分類</th>
              <th class="py-3 px-4 w-32">平台</th>
              <th class="py-3 px-4 min-w-[200px]">作品名稱</th>
              <th class="py-3 px-4 w-60">進度狀態與比例</th>
              <th class="py-3 px-4 w-36 text-center">單集進度</th>
              <th class="py-3 px-4 w-44 text-center">快捷調整</th>
              <th class="py-3 px-4 w-24 text-right">操作</th>
            </tr>
          </thead>
          <tbody id="tracker-table-body" class="divide-y divide-slate-800">
            <!-- 動態渲染資料列 -->
          </tbody>
        </table>
      </div>

      <div id="empty-state" class="hidden flex-col items-center justify-center p-12 text-slate-500">
        <i class="fa-solid fa-inbox text-4xl mb-3"></i>
        <p class="text-base font-medium">目前無任何追蹤項目</p>
      </div>
    </div>
  </main>

  <!-- 新增／編輯彈窗 (Modal) -->
  <div id="item-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-xl w-full max-w-md overflow-hidden shadow-2xl">
      <div class="px-5 py-4 border-b border-slate-800 flex justify-between items-center bg-slate-800/60">
        <h3 id="modal-title" class="text-base font-bold text-slate-100">新增紀錄</h3>
        <button id="modal-close-btn" class="text-slate-400 hover:text-slate-200 text-lg"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="item-form" class="p-5 space-y-4">
        <input type="hidden" id="form-item-id">

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">作品名稱</label>
          <input type="text" id="form-title" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-sky-500">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1.5">主分類</label>
            <select id="form-type" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-sky-500">
              <option value="VIDEO">影劇 / 動畫</option>
              <option value="BOOK">漫畫 / 書籍</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1.5">細分類</label>
            <select id="form-genre" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-sky-500">
              <option value="日劇">日劇</option>
              <option value="美劇">美劇</option>
              <option value="台劇">台劇</option>
              <option value="其它劇">其它劇</option>
              <option value="動畫">動畫</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">平台 / 載體</label>
          <select id="form-platform" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-sky-500">
            <option value="Netflix">Netflix</option>
            <option value="Prime Video">Prime Video</option>
            <option value="CatchPlay+">CatchPlay+</option>
            <option value="MyVideo">MyVideo</option>
            <option value="LINE TV">LINE TV</option>
            <option value="Disney+">Disney+</option>
            <option value="動畫瘋">動畫瘋</option>
            <option value="讀墨">讀墨</option>
            <option value="實體書">實體書</option>
            <option value="其它平台">其它平台</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1.5">當前進度 (集/話/卷)</label>
            <input type="number" id="form-current" min="0" value="0" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-sky-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1.5">總集數 (0 代表未完結/未知)</label>
            <input type="number" id="form-total" min="0" value="0" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-sky-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">當前單集狀態</label>
          <div class="flex items-center space-x-6 pt-1">
            <label class="inline-flex items-center text-sm text-slate-200 cursor-pointer">
              <input type="radio" name="form-status" value="IN_PROGRESS" checked class="text-sky-600 focus:ring-0 mr-2">進行中
            </label>
            <label class="inline-flex items-center text-sm text-slate-200 cursor-pointer">
              <input type="radio" name="form-status" value="COMPLETED" class="text-sky-600 focus:ring-0 mr-2">該集已完看
            </label>
          </div>
        </div>

        <div class="pt-3 flex justify-end space-x-3 border-t border-slate-800">
          <button type="button" id="modal-cancel-btn" class="px-4 py-2 text-sm text-slate-400 hover:text-slate-200">取消</button>
          <button type="submit" class="bg-sky-600 hover:bg-sky-500 text-white px-5 py-2 rounded-lg text-sm font-semibold">儲存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Firebase 設定彈窗 (Modal) -->
  <div id="config-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-xl w-full max-w-md overflow-hidden shadow-2xl">
      <div class="px-5 py-4 border-b border-slate-800 flex justify-between items-center bg-slate-800/60">
        <h3 class="text-base font-bold text-slate-100">Firebase 設定</h3>
        <button id="config-close-btn" class="text-slate-400 hover:text-slate-200 text-lg"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="p-5 space-y-4">
        <p class="text-xs text-slate-400 leading-relaxed">
          貼上 Firebase 專案設定的 JSON。儲存後會保存在瀏覽器中並連線。
        </p>
        <textarea id="firebase-config-input" rows="7" placeholder='{
  "apiKey": "AIzaSy...",
  "authDomain": "your-app.firebaseapp.com",
  "projectId": "your-app",
  "storageBucket": "your-app.appspot.com",
  "messagingSenderId": "...",
  "appId": "..."
}' class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-xs font-mono text-slate-200 focus:outline-none focus:border-sky-500"></textarea>
        <div class="flex justify-end space-x-3 pt-2 border-t border-slate-800">
          <button id="config-clear-btn" class="px-3.5 py-2 text-xs text-rose-400 hover:text-rose-300">清除設定</button>
          <button id="config-save-btn" class="bg-sky-600 hover:bg-sky-500 text-white px-5 py-2 rounded-lg text-xs font-semibold">套用並連線</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase 模組化 SDK (v10) -->
  <script type="module">
    import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithPopup, 
      GoogleAuthProvider, 
      onAuthStateChanged, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      setDoc, 
      deleteDoc, 
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    let db = null;
    let auth = null;
    let currentUser = null;
    let unsubscribeSnapshot = null;
    let items = [];

    const LOCAL_STORAGE_KEY = 'media_tracker_items';
    const FIREBASE_CONFIG_KEY = 'media_tracker_firebase_config';

    const platformColors = {
      'Netflix': 'bg-red-950/70 text-red-300 border-red-800/60',
      'Prime Video': 'bg-sky-950/70 text-sky-300 border-sky-800/60',
      'CatchPlay+': 'bg-amber-950/70 text-amber-300 border-amber-800/60',
      'MyVideo': 'bg-orange-950/70 text-orange-300 border-orange-800/60',
      'LINE TV': 'bg-emerald-950/70 text-emerald-300 border-emerald-800/60',
      'Disney+': 'bg-blue-950/70 text-blue-300 border-blue-800/60',
      '動畫瘋': 'bg-teal-950/70 text-teal-300 border-teal-800/60',
      '讀墨': 'bg-purple-950/70 text-purple-300 border-purple-800/60',
      '實體書': 'bg-stone-800 text-stone-300 border-stone-700',
      '其它平台': 'bg-slate-800 text-slate-300 border-slate-700'
    };

    const genreColors = {
      '日劇': 'bg-rose-900/50 text-rose-300 border-rose-800/40',
      '美劇': 'bg-indigo-900/50 text-indigo-300 border-indigo-800/40',
      '台劇': 'bg-emerald-900/50 text-emerald-300 border-emerald-800/40',
      '其它劇': 'bg-slate-700 text-slate-300 border-slate-600',
      '動畫': 'bg-cyan-900/50 text-cyan-300 border-cyan-800/40',
      '漫畫': 'bg-fuchsia-900/50 text-fuchsia-300 border-fuchsia-800/40',
      '書籍': 'bg-amber-900/50 text-amber-300 border-amber-800/40'
    };

    function initFirebase() {
      const savedConfig = localStorage.getItem(FIREBASE_CONFIG_KEY);
      if (!savedConfig) {
        setSyncStatus('離線模式', 'bg-slate-800 text-slate-400');
        loadLocalData();
        return;
      }

      try {
        const config = JSON.parse(savedConfig);
        const app = getApps().length === 0 ? initializeApp(config) : getApps()[0];
        auth = getAuth(app);
        db = getFirestore(app);

        onAuthStateChanged(auth, (user) => {
          if (user) {
            currentUser = user;
            updateUserUI(user);
            setSyncStatus('已同步 (雲端)', 'bg-emerald-950/80 text-emerald-400 border-emerald-800');
            bindFirestoreListener(user.uid);
          } else {
            currentUser = null;
            updateUserUI(null);
            setSyncStatus('尚未登入 (使用本地快取)', 'bg-amber-950/80 text-amber-400 border-amber-800');
            if (unsubscribeSnapshot) unsubscribeSnapshot();
            loadLocalData();
          }
        });
      } catch (err) {
        console.error('Firebase 初始化失敗:', err);
        setSyncStatus('連線錯誤', 'bg-rose-950/80 text-rose-400 border-rose-800');
        loadLocalData();
      }
    }

    function bindFirestoreListener(uid) {
      if (!db || !uid) return;
      if (unsubscribeSnapshot) unsubscribeSnapshot();

      const itemsCol = collection(db, 'users', uid, 'items');
      unsubscribeSnapshot = onSnapshot(itemsCol, (snapshot) => {
        const cloudItems = [];
        snapshot.forEach(docSnap => {
          cloudItems.push({ id: docSnap.id, ...docSnap.data() });
        });
        cloudItems.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
        items = cloudItems;
        saveLocalBackup(items);
        renderTable();
      }, (error) => {
        console.error('Firestore 讀取失敗:', error);
        setSyncStatus('存取遭拒', 'bg-rose-950/80 text-rose-400 border-rose-800');
      });
    }

    function updateUserUI(user) {
      const loginBtn = document.getElementById('btn-login');
      const userProfile = document.getElementById('user-profile');
      const userAvatar = document.getElementById('user-avatar');
      const userName = document.getElementById('user-name');

      if (user) {
        loginBtn.classList.add('hidden');
        userProfile.classList.remove('hidden');
        userAvatar.src = user.photoURL || 'https://via.placeholder.com/32';
        userName.textContent = user.displayName || user.email || '使用者';
      } else {
        loginBtn.classList.remove('hidden');
        userProfile.classList.add('hidden');
      }
    }

    function setSyncStatus(text, badgeClass) {
      const statusEl = document.getElementById('sync-status');
      statusEl.textContent = text;
      statusEl.className = `text-xs px-2.5 py-1 rounded-full border ${badgeClass}`;
    }

    function loadLocalData() {
      const raw = localStorage.getItem(LOCAL_STORAGE_KEY);
      items = raw ? JSON.parse(raw) : [];
      renderTable();
    }

    function saveLocalBackup(data) {
      localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(data));
    }

    async function persistItem(item) {
      item.updatedAt = Date.now();
      if (db && currentUser) {
        const docRef = doc(db, 'users', currentUser.uid, 'items', item.id);
        await setDoc(docRef, item);
      } else {
        const idx = items.findIndex(i => i.id === item.id);
        if (idx >= 0) items[idx] = item;
        else items.unshift(item);
        saveLocalBackup(items);
        renderTable();
      }
    }

    async function removeItem(id) {
      if (!confirm('確定要刪除這筆紀錄嗎？')) return;
      if (db && currentUser) {
        const docRef = doc(db, 'users', currentUser.uid, 'items', id);
        await deleteDoc(docRef);
      } else {
        items = items.filter(i => i.id !== id);
        saveLocalBackup(items);
        renderTable();
      }
    }

    function renderTable() {
      const tbody = document.getElementById('tracker-table-body');
      const emptyState = document.getElementById('empty-state');
      const typeFilter = document.getElementById('filter-type').value;
      const genreFilter = document.getElementById('filter-genre').value;
      const platformFilter = document.getElementById('filter-platform').value;
      const searchKeyword = document.getElementById('search-input').value.trim().toLowerCase();

      tbody.innerHTML = '';

      const filtered = items.filter(item => {
        if (typeFilter !== 'ALL' && item.type !== typeFilter) return false;
        if (genreFilter !== 'ALL' && item.genre !== genreFilter) return false;
        if (platformFilter !== 'ALL' && item.platform !== platformFilter) return false;
        if (searchKeyword && !item.title.toLowerCase().includes(searchKeyword)) return false;
        return true;
      });

      if (filtered.length === 0) {
        emptyState.classList.remove('hidden');
        emptyState.classList.add('flex');
        return;
      } else {
        emptyState.classList.add('hidden');
        emptyState.classList.remove('flex');
      }

      filtered.forEach(item => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-800/40 transition border-b border-slate-800/70';

        const pColor = platformColors[item.platform] || platformColors['其它平台'];
        const gColor = genreColors[item.genre] || 'bg-slate-800 text-slate-300 border-slate-700';
        
        const current = Number(item.current) || 0;
        const total = Number(item.total) || 0;
        const percent = total > 0 ? Math.min(100, Math.round((current / total) * 100)) : 0;
        const isStatusCompleted = item.status === 'COMPLETED';

        tr.innerHTML = `
          <!-- 分類標籤 -->
          <td class="py-3 px-4">
            <span class="inline-block text-xs px-2.5 py-1 rounded-md border font-semibold ${gColor}">
              ${item.genre || (item.type === 'BOOK' ? '漫畫' : '影劇')}
            </span>
          </td>

          <!-- 平台標籤 -->
          <td class="py-3 px-4">
            <span class="inline-block text-xs px-2.5 py-1 rounded-md border font-semibold ${pColor}">
              ${item.platform}
            </span>
          </td>

          <!-- 作品名稱 -->
          <td class="py-3 px-4">
            <div class="truncate max-w-[210px] sm:max-w-[280px] text-base font-bold text-slate-100" title="${item.title}">
              ${item.title}
            </div>
          </td>

          <!-- 進度狀態與比例 (特大號數字呈現) -->
          <td class="py-3 px-4">
            <div class="w-full">
              <div class="flex justify-between items-baseline mb-1.5">
                <div class="flex items-baseline space-x-1">
                  <span class="text-xs text-slate-400">第</span>
                  <span class="text-[18px] font-black text-sky-400 tracking-tight leading-none">${current}</span>
                  <span class="text-xs text-slate-400">${total > 0 ? `/ ${total}` : ''} ${item.type === 'BOOK' ? '話/卷' : '集'}</span>
                </div>
                <span class="text-[16px] font-black text-slate-200 tracking-tight leading-none">
                  ${total > 0 ? `${percent}%` : '<span class="text-xs font-semibold text-slate-400">連載中</span>'}
                </span>
              </div>
              <div class="w-full bg-slate-800 rounded-full h-2 overflow-hidden border border-slate-700/50">
                <div class="bg-sky-500 h-2 rounded-full transition-all" style="width: ${total > 0 ? percent : (current > 0 ? 100 : 0)}%"></div>
              </div>
            </div>
          </td>

          <!-- 單集狀態切換按鈕 -->
          <td class="py-3 px-4 text-center">
            <button class="status-toggle text-xs px-3.5 py-1.5 rounded-full font-bold transition border ${
              isStatusCompleted 
                ? 'bg-emerald-950/70 text-emerald-300 border-emerald-700 hover:bg-emerald-900/80 shadow-sm' 
                : 'bg-amber-950/70 text-amber-300 border-amber-700 hover:bg-amber-900/80 shadow-sm'
            }" data-id="${item.id}">
              <i class="fa-solid ${isStatusCompleted ? 'fa-circle-check' : 'fa-circle-play'} mr-1.5"></i>${isStatusCompleted ? '已看完' : '進行中'}
            </button>
          </td>

          <!-- 加大觸控快捷調整步進盒 (40px 按鈕、48px 數值展示) -->
          <td class="py-3 px-4 text-center">
            <div class="inline-flex items-center rounded-lg border border-slate-700 bg-slate-800 shadow-sm overflow-hidden">
              <button class="step-btn w-10 h-10 flex items-center justify-center text-slate-300 hover:text-white hover:bg-slate-700 active:bg-slate-600 transition" data-id="${item.id}" data-action="dec" title="減 1 集">
                <i class="fa-solid fa-minus text-sm"></i>
              </button>
              <span class="w-12 h-10 flex items-center justify-center text-base font-black font-mono text-slate-100 bg-slate-900/70 border-x border-slate-700 select-none">
                ${current}
              </span>
              <button class="step-btn w-10 h-10 flex items-center justify-center text-slate-300 hover:text-white hover:bg-slate-700 active:bg-slate-600 transition" data-id="${item.id}" data-action="inc" title="加 1 集">
                <i class="fa-solid fa-plus text-sm"></i>
              </button>
            </div>
          </td>

          <!-- 操作按鈕 -->
          <td class="py-3 px-4 text-right">
            <button class="edit-btn text-slate-400 hover:text-sky-400 p-2 rounded transition" data-id="${item.id}" title="編輯"><i class="fa-regular fa-pen-to-square text-base"></i></button>
            <button class="delete-btn text-slate-400 hover:text-rose-400 p-2 rounded transition" data-id="${item.id}" title="刪除"><i class="fa-regular fa-trash-can text-base"></i></button>
          </td>
        `;

        tbody.appendChild(tr);
      });

      attachRowEvents();
    }

    function attachRowEvents() {
      document.querySelectorAll('.status-toggle').forEach(btn => {
        btn.onclick = () => {
          const id = btn.getAttribute('data-id');
          const target = items.find(i => i.id === id);
          if (target) {
            target.status = target.status === 'COMPLETED' ? 'IN_PROGRESS' : 'COMPLETED';
            persistItem(target);
          }
        };
      });

      document.querySelectorAll('.step-btn').forEach(btn => {
        btn.onclick = () => {
          const id = btn.getAttribute('data-id');
          const action = btn.getAttribute('data-action');
          const target = items.find(i => i.id === id);
          if (target) {
            let cur = Number(target.current) || 0;
            if (action === 'inc') cur += 1;
            else if (action === 'dec' && cur > 0) cur -= 1;
            target.current = cur;
            persistItem(target);
          }
        };
      });

      document.querySelectorAll('.edit-btn').forEach(btn => {
        btn.onclick = () => {
          const id = btn.getAttribute('data-id');
          const target = items.find(i => i.id === id);
          if (target) openItemModal(target);
        };
      });

      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.onclick = () => {
          const id = btn.getAttribute('data-id');
          removeItem(id);
        };
      });
    }

    const itemModal = document.getElementById('item-modal');
    const formType = document.getElementById('form-type');
    const formGenre = document.getElementById('form-genre');

    function updateGenreOptions(typeVal, selectedGenre = null) {
      formGenre.innerHTML = '';
      if (typeVal === 'VIDEO') {
        const opts = ['日劇', '美劇', '台劇', '其它劇', '動畫'];
        opts.forEach(g => {
          const opt = document.createElement('option');
          opt.value = g;
          opt.textContent = g;
          formGenre.appendChild(opt);
        });
      } else {
        const opts = ['漫畫', '書籍'];
        opts.forEach(g => {
          const opt = document.createElement('option');
          opt.value = g;
          opt.textContent = g;
          formGenre.appendChild(opt);
        });
      }
      if (selectedGenre) formGenre.value = selectedGenre;
    }

    formType.addEventListener('change', () => {
      updateGenreOptions(formType.value);
    });

    function openItemModal(item = null) {
      document.getElementById('modal-title').textContent = item ? '編輯進度紀錄' : '新增進度紀錄';
      document.getElementById('form-item-id').value = item ? item.id : '';
      document.getElementById('form-title').value = item ? item.title : '';
      document.getElementById('form-type').value = item ? item.type : 'VIDEO';
      
      updateGenreOptions(item ? item.type : 'VIDEO', item ? item.genre : '日劇');

      document.getElementById('form-platform').value = item ? item.platform : 'Netflix';
      document.getElementById('form-current').value = item ? item.current : 0;
      document.getElementById('form-total').value = item ? item.total : 0;

      const radios = document.getElementsByName('form-status');
      const curStatus = item ? item.status : 'IN_PROGRESS';
      radios.forEach(r => { r.checked = (r.value === curStatus); });

      itemModal.classList.remove('hidden');
    }

    function closeItemModal() {
      itemModal.classList.add('hidden');
      document.getElementById('item-form').reset();
    }

    document.getElementById('btn-add-item').onclick = () => openItemModal();
    document.getElementById('modal-close-btn').onclick = closeItemModal;
    document.getElementById('modal-cancel-btn').onclick = closeItemModal;

    document.getElementById('item-form').onsubmit = (e) => {
      e.preventDefault();
      const id = document.getElementById('form-item-id').value || 'item_' + Date.now();
      const statusRadios = document.getElementsByName('form-status');
      let statusVal = 'IN_PROGRESS';
      statusRadios.forEach(r => { if (r.checked) statusVal = r.value; });

      const itemData = {
        id: id,
        title: document.getElementById('form-title').value.trim(),
        type: document.getElementById('form-type').value,
        genre: document.getElementById('form-genre').value,
        platform: document.getElementById('form-platform').value,
        current: Number(document.getElementById('form-current').value) || 0,
        total: Number(document.getElementById('form-total').value) || 0,
        status: statusVal
      };

      persistItem(itemData);
      closeItemModal();
    };

    const configModal = document.getElementById('config-modal');
    document.getElementById('btn-config').onclick = () => {
      const saved = localStorage.getItem(FIREBASE_CONFIG_KEY);
      document.getElementById('firebase-config-input').value = saved || '';
      configModal.classList.remove('hidden');
    };
    document.getElementById('config-close-btn').onclick = () => configModal.classList.add('hidden');
    document.getElementById('config-clear-btn').onclick = () => {
      localStorage.removeItem(FIREBASE_CONFIG_KEY);
      configModal.classList.add('hidden');
      location.reload();
    };
    document.getElementById('config-save-btn').onclick = () => {
      const val = document.getElementById('firebase-config-input').value.trim();
      try {
        JSON.parse(val);
        localStorage.setItem(FIREBASE_CONFIG_KEY, val);
        configModal.classList.add('hidden');
        location.reload();
      } catch (err) {
        alert('JSON 格式有誤，請確認後重新貼上。');
      }
    };

    document.getElementById('btn-login').onclick = async () => {
      if (!auth) {
        alert('請先點擊「設定」填入 Firebase 專案設定 JSON。');
        return;
      }
      const provider = new GoogleAuthProvider();
      try {
        await signInWithPopup(auth, provider);
      } catch (err) {
        console.error('登入錯誤:', err);
        alert('Google 登入失敗: ' + err.message + '\n\n請確認已將目前的網域名稱加入 Firebase Authorized Domains。');
      }
    };

    document.getElementById('btn-logout').onclick = async () => {
      if (auth) {
        await signOut(auth);
      }
    };

    document.getElementById('filter-type').onchange = renderTable;
    document.getElementById('filter-genre').onchange = renderTable;
    document.getElementById('filter-platform').onchange = renderTable;
    document.getElementById('search-input').oninput = renderTable;

    initFirebase();
  </script>
</body>
</html>
