<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>追劇＆漫畫進度追蹤庫 | Media Tracker</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              500: '#0284c7',
              600: '#0369a1',
              700: '#075985',
              900: '#0c4a6e'
            }
          }
        }
      }
    };
  </script>
  <!-- Phosphor Icons for crisp modern UI icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    /* Custom scrollbar for dense data rows */
    ::-webkit-scrollbar {
      height: 6px;
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #18181b;
    }
    ::-webkit-scrollbar-thumb {
      background: #3f3f46;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #52525b;
    }
    .min-w-custom {
      min-width: 820px;
    }
    @media (min-width: 1024px) {
      .min-w-custom {
        min-width: 100%;
      }
    }
  </style>
</head>

<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col font-sans antialiased selection:bg-sky-500 selection:text-white">

  <!-- Header -->
  <header class="sticky top-0 z-30 border-b border-zinc-800 bg-zinc-900/90 backdrop-blur-md px-4 py-3 sm:px-6">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-sky-500/20">
          <i class="ph ph-film-strip text-xl text-white"></i>
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-bold tracking-tight text-white leading-none">追劇＆漫畫進度庫</h1>
          <p class="text-[11px] text-zinc-400 mt-0.5">跨平台影劇、動畫與實體/電子書紀錄</p>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center gap-2">
        <button id="btnOpenFirebaseSettings" class="px-3 py-1.5 rounded-lg border border-zinc-700 bg-zinc-800/80 hover:bg-zinc-700 text-xs font-medium text-zinc-300 flex items-center gap-1.5 transition">
          <i class="ph ph-database text-amber-400 text-sm"></i>
          <span class="hidden sm:inline">Firebase 設定</span>
          <span id="syncIndicator" class="w-2 h-2 rounded-full bg-zinc-500" title="離線/本地模式"></span>
        </button>

        <button id="btnOpenAddModal" class="px-3.5 py-1.5 rounded-lg bg-sky-600 hover:bg-sky-500 text-white text-xs sm:text-sm font-semibold flex items-center gap-1.5 shadow-md shadow-sky-950 transition active:scale-95">
          <i class="ph ph-plus-circle text-base"></i>
          <span>新增追蹤</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-6 py-4 flex flex-col gap-4">

    <!-- Overview Stats Bar -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 text-xs sm:text-sm">
      <div class="bg-zinc-900/80 border border-zinc-800/80 rounded-xl p-3 flex items-center gap-3">
        <div class="p-2.5 rounded-lg bg-sky-500/10 text-sky-400"><i class="ph ph-television-simple text-xl"></i></div>
        <div>
          <div class="text-zinc-400 text-xs">追劇中項目</div>
          <div id="statWatching" class="text-lg font-bold text-white">0</div>
        </div>
      </div>
      <div class="bg-zinc-900/80 border border-zinc-800/80 rounded-xl p-3 flex items-center gap-3">
        <div class="p-2.5 rounded-lg bg-emerald-500/10 text-emerald-400"><i class="ph ph-check-circle text-xl"></i></div>
        <div>
          <div class="text-zinc-400 text-xs">已看完/完結</div>
          <div id="statCompleted" class="text-lg font-bold text-white">0</div>
        </div>
      </div>
      <div class="bg-zinc-900/80 border border-zinc-800/80 rounded-xl p-3 flex items-center gap-3">
        <div class="p-2.5 rounded-lg bg-purple-500/10 text-purple-400"><i class="ph ph-book-open-text text-xl"></i></div>
        <div>
          <div class="text-zinc-400 text-xs">書籍/漫畫數</div>
          <div id="statBooks" class="text-lg font-bold text-white">0</div>
        </div>
      </div>
      <div class="bg-zinc-900/80 border border-zinc-800/80 rounded-xl p-3 flex items-center gap-3">
        <div class="p-2.5 rounded-lg bg-rose-500/10 text-rose-400"><i class="ph ph-stack text-xl"></i></div>
        <div>
          <div class="text-zinc-400 text-xs">收藏總計</div>
          <div id="statTotal" class="text-lg font-bold text-white">0</div>
        </div>
      </div>
    </div>

    <!-- Filter & Search Controls -->
    <div class="bg-zinc-900/90 border border-zinc-800 rounded-xl p-3 flex flex-col md:flex-row gap-3 items-stretch md:items-center justify-between">
      <div class="flex flex-wrap items-center gap-2">
        <!-- Category Filter -->
        <div class="flex bg-zinc-800 rounded-lg p-0.5 text-xs font-medium">
          <button class="filter-cat-btn px-2.5 py-1 rounded-md bg-zinc-700 text-white" data-cat="all">全部</button>
          <button class="filter-cat-btn px-2.5 py-1 rounded-md text-zinc-400 hover:text-white" data-cat="video">影劇/動畫</button>
          <button class="filter-cat-btn px-2.5 py-1 rounded-md text-zinc-400 hover:text-white" data-cat="manga">漫畫/書籍</button>
        </div>

        <!-- Drama Sub-Category Filter -->
        <select id="subTypeFilter" class="bg-zinc-800 border border-zinc-700 text-xs text-zinc-200 rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-sky-500">
          <option value="all">所有劇種/類型</option>
          <option value="jp_drama">日劇</option>
          <option value="us_drama">美劇</option>
          <option value="tw_drama">台劇</option>
          <option value="anime">動畫</option>
          <option value="other_drama">其它劇集/電影</option>
        </select>

        <!-- Status Filter -->
        <select id="statusFilter" class="bg-zinc-800 border border-zinc-700 text-xs text-zinc-200 rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-sky-500">
          <option value="all">所有狀態</option>
          <option value="watching">進行中 (追劇/閱讀中)</option>
          <option value="completed">已完結 / 已看完</option>
          <option value="dropped">暫停 / 棄坑</option>
        </select>

        <!-- Platform Filter -->
        <select id="platformFilter" class="bg-zinc-800 border border-zinc-700 text-xs text-zinc-200 rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-sky-500">
          <option value="all">所有平台</option>
          <option value="Netflix">Netflix</option>
          <option value="Prime Video">Prime Video</option>
          <option value="Disney+">Disney+</option>
          <option value="巴哈姆特動畫瘋">巴哈姆特動畫瘋</option>
          <option value="Catchplay+">Catchplay+</option>
          <option value="MyVideo">MyVideo</option>
          <option value="LINE TV">LINE TV</option>
          <option value="讀墨">讀墨 (Readmoo)</option>
          <option value="實體書">實體書</option>
          <option value="其他">其他</option>
        </select>
      </div>

      <!-- Search Input -->
      <div class="relative min-w-[200px]">
        <i class="ph ph-magnifying-glass absolute left-3 top-2.5 text-zinc-400 text-sm"></i>
        <input id="searchInput" type="text" placeholder="搜尋作品名稱、備註..." class="w-full bg-zinc-800/90 border border-zinc-700 rounded-lg pl-8 pr-3 py-1.5 text-xs text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-sky-500" />
      </div>
    </div>

    <!-- Data View Section (Dense Horizontal Rows) -->
    <div class="border border-zinc-800 rounded-xl bg-zinc-900/60 shadow-xl overflow-hidden flex flex-col">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse min-w-custom text-xs">
          <thead>
            <tr class="bg-zinc-900 border-b border-zinc-800 text-zinc-400 font-medium">
              <th class="py-2.5 px-3 w-32">平台 / 類別</th>
              <th class="py-2.5 px-3 min-w-[180px]">作品名稱</th>
              <th class="py-2.5 px-3 w-28 text-center">總體狀態</th>
              <th class="py-2.5 px-3 w-56">集數/章節進度</th>
              <th class="py-2.5 px-3 w-36 text-center">當前集數觀看點</th>
              <th class="py-2.5 px-3 min-w-[140px]">備註/標籤</th>
              <th class="py-2.5 px-3 w-36 text-right pr-4">快速操作</th>
            </tr>
          </thead>
          <tbody id="mediaTableBody" class="divide-y divide-zinc-800/80 font-normal">
            <!-- Dynamic rows will render here -->
          </tbody>
        </table>
      </div>

      <!-- Empty State -->
      <div id="emptyState" class="hidden py-14 text-center text-zinc-500">
        <i class="ph ph-folder-notch-open text-4xl mb-2 text-zinc-600 block"></i>
        <p class="text-sm">目前沒有相符的追蹤項目</p>
        <p class="text-xs text-zinc-600 mt-1">點擊上方「新增追蹤」按鈕開始記錄你的進度吧！</p>
      </div>
    </div>
  </main>

  <!-- Item Edit/Create Modal -->
  <div id="itemModal" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm hidden items-center justify-center p-3">
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl w-full max-w-lg p-5 shadow-2xl overflow-y-auto max-h-[90vh]">
      <div class="flex items-center justify-between pb-3 border-b border-zinc-800 mb-4">
        <h3 id="modalTitle" class="text-base font-bold text-white flex items-center gap-2">
          <i class="ph ph-pencil-simple-line text-sky-400"></i>
          <span>新增追蹤項目</span>
        </h3>
        <button id="btnCloseModal" class="text-zinc-400 hover:text-white p-1 rounded-lg">
          <i class="ph ph-x text-lg"></i>
        </button>
      </div>

      <form id="itemForm" class="space-y-3.5 text-xs">
        <input type="hidden" id="editItemId" />

        <!-- Title -->
        <div>
          <label class="block text-zinc-400 font-medium mb-1">作品名稱 <span class="text-rose-500">*</span></label>
          <input type="text" id="inputTitle" required placeholder="例如：葬送的芙莉蓮、咒術迴戰..." class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-sky-500" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <!-- Category -->
          <div>
            <label class="block text-zinc-400 font-medium mb-1">主分類</label>
            <select id="inputCategory" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-zinc-100 focus:outline-none focus:border-sky-500">
              <option value="video">影劇 / 動畫</option>
              <option value="manga">漫畫 / 實體書籍</option>
            </select>
          </div>

          <!-- Drama Sub-Type (Dynamic visibility) -->
          <div id="subTypeContainer">
            <label class="block text-zinc-400 font-medium mb-1">戲劇/影視細分</label>
            <select id="inputSubType" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-zinc-100 focus:outline-none focus:border-sky-500">
              <option value="jp_drama">日劇</option>
              <option value="us_drama">美劇</option>
              <option value="tw_drama">台劇</option>
              <option value="anime">動畫</option>
              <option value="other_drama">其它</option>
            </select>
          </div>

          <!-- Manga Format (shown when manga is selected) -->
          <div id="mangaTypeContainer" class="hidden">
            <label class="block text-zinc-400 font-medium mb-1">書籍形式</label>
            <select id="inputMangaType" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-zinc-100 focus:outline-none focus:border-sky-500">
              <option value="comic">連載漫畫 / 單行本</option>
              <option value="novel">輕小說 / 實體書</option>
              <option value="other_book">其它出版物</option>
            </select>
          </div>
        </div>

        <!-- Platform Selection -->
        <div>
          <label class="block text-zinc-400 font-medium mb-1">所屬平台 / 載體</label>
          <select id="inputPlatform" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-zinc-100 focus:outline-none focus:border-sky-500">
            <option value="Netflix">Netflix</option>
            <option value="Prime Video">Prime Video</option>
            <option value="Catchplay+">Catchplay+</option>
            <option value="MyVideo">MyVideo</option>
            <option value="LINE TV">LINE TV</option>
            <option value="Disney+">Disney+</option>
            <option value="巴哈姆特動畫瘋">巴哈姆特動畫瘋</option>
            <option value="讀墨">讀墨 (Readmoo)</option>
            <option value="實體書">實體書</option>
            <option value="其他">其他</option>
          </select>
        </div>

        <!-- Progress Numbers -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-zinc-400 font-medium mb-1">目前進度 (話/集/卷)</label>
            <input type="number" id="inputCurrentEp" min="0" value="1" required class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-zinc-100 focus:outline-none focus:border-sky-500" />
          </div>
          <div>
            <label class="block text-zinc-400 font-medium mb-1">總集數 / 總卷數</label>
            <input type="number" id="inputTotalEp" min="0" placeholder="未定留空或填 0" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-sky-500" />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <!-- Current Episode State (進行中 vs 結束) -->
          <div>
            <label class="block text-zinc-400 font-medium mb-1">該集觀看進度</label>
            <select id="inputEpState" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-zinc-100 focus:outline-none focus:border-sky-500">
              <option value="watching">進行中 (未看完整集/正在讀)</option>
              <option value="finished">已看完 (整集看完，準備看下一集)</option>
            </select>
          </div>

          <!-- Overall Status -->
          <div>
            <label class="block text-zinc-400 font-medium mb-1">整體狀態</label>
            <select id="inputStatus" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-zinc-100 focus:outline-none focus:border-sky-500">
              <option value="watching">追劇/閱讀中</option>
              <option value="completed">全劇完結 / 已閱畢</option>
              <option value="dropped">暫停 / 棄坑</option>
            </select>
          </div>
        </div>

        <!-- Note / Tags -->
        <div>
          <label class="block text-zinc-400 font-medium mb-1">備註 / 心得評分</label>
          <input type="text" id="inputNotes" placeholder="例：每週六晚上更新、五星神作、看到第 45 頁" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-sky-500" />
        </div>

        <!-- Submit & Cancel buttons -->
        <div class="flex items-center justify-end gap-2.5 pt-3 border-t border-zinc-800">
          <button type="button" id="btnCancelModal" class="px-3.5 py-1.5 rounded-lg border border-zinc-700 text-zinc-300 hover:bg-zinc-800 transition">取消</button>
          <button type="submit" class="px-4 py-1.5 rounded-lg bg-sky-600 hover:bg-sky-500 text-white font-medium transition shadow-md shadow-sky-950">儲存資料</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Firebase Configuration Modal -->
  <div id="firebaseModal" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm hidden items-center justify-center p-3">
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl w-full max-w-md p-5 shadow-2xl">
      <div class="flex items-center justify-between pb-3 border-b border-zinc-800 mb-3">
        <h3 class="text-base font-bold text-white flex items-center gap-2">
          <i class="ph ph-fire text-amber-500"></i>
          <span>Firebase Firestore 連線設定</span>
        </h3>
        <button id="btnCloseFirebaseModal" class="text-zinc-400 hover:text-white p-1">
          <i class="ph ph-x text-lg"></i>
        </button>
      </div>

      <p class="text-xs text-zinc-400 mb-3 leading-relaxed">
        可將資料同步至您自己的 Firebase Firestore，在電腦瀏覽器與手機 Chrome 間隨時同步！若無配置，系統將自動保存在瀏覽器本地快取中。
      </p>

      <form id="firebaseForm" class="space-y-2.5 text-xs">
        <div>
          <label class="block text-zinc-400 font-medium mb-1">API Key</label>
          <input type="text" id="fbApiKey" placeholder="AIzaSy..." class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-1.5 text-zinc-100 focus:outline-none focus:border-sky-500 font-mono text-[11px]" />
        </div>
        <div>
          <label class="block text-zinc-400 font-medium mb-1">Auth Domain</label>
          <input type="text" id="fbAuthDomain" placeholder="your-project.firebaseapp.com" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-1.5 text-zinc-100 focus:outline-none focus:border-sky-500 font-mono text-[11px]" />
        </div>
        <div>
          <label class="block text-zinc-400 font-medium mb-1">Project ID</label>
          <input type="text" id="fbProjectId" placeholder="your-project-id" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-1.5 text-zinc-100 focus:outline-none focus:border-sky-500 font-mono text-[11px]" />
        </div>
        <div>
          <label class="block text-zinc-400 font-medium mb-1">Storage Bucket (選填)</label>
          <input type="text" id="fbStorageBucket" placeholder="your-project.appspot.com" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-1.5 text-zinc-100 focus:outline-none focus:border-sky-500 font-mono text-[11px]" />
        </div>
        <div>
          <label class="block text-zinc-400 font-medium mb-1">App ID</label>
          <input type="text" id="fbAppId" placeholder="1:12345678:web:abcdef" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-1.5 text-zinc-100 focus:outline-none focus:border-sky-500 font-mono text-[11px]" />
        </div>

        <div class="flex items-center justify-between pt-3 border-t border-zinc-800">
          <button type="button" id="btnClearFirebase" class="text-rose-400 hover:text-rose-300 text-xs">清除配置 (改用本地)</button>
          <div class="flex gap-2">
            <button type="button" id="btnCancelFirebase" class="px-3 py-1.5 rounded-lg border border-zinc-700 text-zinc-300 hover:bg-zinc-800">關閉</button>
            <button type="submit" class="px-4 py-1.5 rounded-lg bg-sky-600 hover:bg-sky-500 text-white font-medium">儲存並連接</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div id="deleteModal" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm hidden items-center justify-center p-3">
    <div class="bg-zinc-900 border border-zinc-800 rounded-xl w-full max-w-sm p-4 text-center">
      <div class="w-10 h-10 rounded-full bg-rose-500/20 text-rose-400 flex items-center justify-center mx-auto mb-2 text-xl">
        <i class="ph ph-trash"></i>
      </div>
      <h4 class="text-sm font-bold text-white mb-1">確認刪除此項目？</h4>
      <p id="deleteItemTitle" class="text-xs text-zinc-400 mb-4 truncate"></p>
      <div class="flex justify-center gap-2 text-xs">
        <button id="btnCancelDelete" class="px-3.5 py-1.5 rounded-lg border border-zinc-700 text-zinc-300 hover:bg-zinc-800">取消</button>
        <button id="btnConfirmDelete" class="px-3.5 py-1.5 rounded-lg bg-rose-600 hover:bg-rose-500 text-white font-medium">確定刪除</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-4 right-4 z-50 transform translate-y-16 opacity-0 transition duration-300 pointer-events-none bg-zinc-800 text-white border border-zinc-700 px-3.5 py-2 rounded-xl shadow-xl flex items-center gap-2 text-xs">
    <i id="toastIcon" class="ph ph-check-circle text-emerald-400 text-base"></i>
    <span id="toastMsg">操作成功</span>
  </div>

  <!-- Firebase Modular SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      setDoc, 
      deleteDoc, 
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Application State
    let items = [];
    let firestoreDb = null;
    let authUser = null;
    let unsubscribeFirestore = null;
    let activeCategoryFilter = 'all';
    let itemToDelete = null;

    // Platform Badge Colors Map
    const platformConfig = {
      'Netflix': { bg: 'bg-red-950/80', text: 'text-red-400', border: 'border-red-800/60' },
      'Prime Video': { bg: 'bg-sky-950/80', text: 'text-sky-300', border: 'border-sky-800/60' },
      'Disney+': { bg: 'bg-blue-950/80', text: 'text-blue-300', border: 'border-blue-800/60' },

    // Helper: Toast Notifications
    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      const toastIcon = document.getElementById('toastIcon');

      toastMsg.innerText = message;
      if (type === 'error') {
        toastIcon.className = 'ph ph-warning-circle text-rose-400 text-base';
      } else {
        toastIcon.className = 'ph ph-check-circle text-emerald-400 text-base';
      }

      toast.classList.remove('translate-y-16', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-16', 'opacity-0');
      }, 2500);
    }

    // Load Items: Local Fallback
    function loadLocalItems() {
      const stored = localStorage.getItem('media_tracker_items');
      if (stored) {
        try {
          items = JSON.parse(stored);
        } catch (e) {
          items = defaultData;
        }
      } else {
        items = defaultData;
        saveLocalItems();
      }
      render();
    }

    function saveLocalItems() {
      localStorage.setItem('media_tracker_items', JSON.stringify(items));
    }

    // Initialize Firebase Connection
    async function initFirebase() {
      const rawConfig = localStorage.getItem('fb_credentials');
      const indicator = document.getElementById('syncIndicator');

      if (!rawConfig) {
        indicator.className = 'w-2 h-2 rounded-full bg-amber-500';
        indicator.title = '使用本地儲存模式';
        loadLocalItems();
        return;
      }

      try {
        const config = JSON.parse(rawConfig);
        const app = initializeApp(config);
        const auth = getAuth(app);
        const userCred = await signInAnonymously(auth);
        authUser = userCred.user;
        firestoreDb = getFirestore(app);

        indicator.className = 'w-2 h-2 rounded-full bg-emerald-400 animate-pulse';
        indicator.title = 'Firebase 雲端同步已連線';

        // Listen for real-time changes
        const appId = config.projectId || 'personal-tracker';
        const collRef = collection(firestoreDb, 'artifacts', appId, 'public', 'data', 'media_items');

        if (unsubscribeFirestore) unsubscribeFirestore();

        unsubscribeFirestore = onSnapshot(collRef, (snapshot) => {
          const cloudItems = [];
          snapshot.forEach((d) => {
            cloudItems.push({ id: d.id, ...d.data() });
          });

          if (cloudItems.length === 0 && items.length === 0) {
            // Seed cloud if empty
            defaultData.forEach(async (it) => {
              await setDoc(doc(collRef, it.id), it);
            });
          } else {
            items = cloudItems.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
            saveLocalItems(); // keep mirror
            render();
          }
        }, (error) => {
          console.error("Firestore snapshot error:", error);
          showToast('無法同步雲端，載入本地快取', 'error');
          loadLocalItems();
        });

      } catch (err) {
        console.error("Firebase init failed:", err);
        indicator.className = 'w-2 h-2 rounded-full bg-rose-500';
        indicator.title = 'Firebase 連線失敗，切換至本地';
        loadLocalItems();
      }
    }

    // Save/Update Item Handler
    async function persistItem(item) {
      item.updatedAt = Date.now();
      const rawConfig = localStorage.getItem('fb_credentials');

      if (firestoreDb && rawConfig) {
        try {
          const config = JSON.parse(rawConfig);
          const appId = config.projectId || 'personal-tracker';
          const itemRef = doc(firestoreDb, 'artifacts', appId, 'public', 'data', 'media_items', item.id);
          await setDoc(itemRef, item);
          showToast('已同步儲存');
          return;
        } catch (e) {
          console.error("Cloud save failed:", e);
        }
      }

      // Local fallback
      const existingIdx = items.findIndex(i => i.id === item.id);
      if (existingIdx >= 0) {
        items[existingIdx] = item;
      } else {
        items.unshift(item);
      }
      saveLocalItems();
      render();
      showToast('已儲存至本地');
    }

    // Delete Item Handler
    async function removeItem(id) {
      const rawConfig = localStorage.getItem('fb_credentials');
      if (firestoreDb && rawConfig) {
        try {
          const config = JSON.parse(rawConfig);
          const appId = config.projectId || 'personal-tracker';
          const itemRef = doc(firestoreDb, 'artifacts', appId, 'public', 'data', 'media_items', id);
          await deleteDoc(itemRef);
          showToast('已自雲端刪除');
          return;
        } catch (e) {
          console.error("Cloud delete failed:", e);
        }
      }

      items = items.filter(i => i.id !== id);
      saveLocalItems();
      render();
      showToast('已自本地刪除');
    }

    // Quick Increment/Decrement
    window.adjustEpisode = async (id, delta) => {
      const item = items.find(i => i.id === id);
      if (!item) return;

      const newEp = Math.max(0, (parseInt(item.currentEp, 10) || 0) + delta);
      item.currentEp = newEp;

      // Auto check if completed
      if (item.totalEp && item.totalEp > 0 && newEp >= item.totalEp) {
        item.status = 'completed';
        item.epState = 'finished';
      }

      await persistItem({ ...item });
    };

    // Toggle Episode Watching Point
    window.toggleEpisodeState = async (id) => {
      const item = items.find(i => i.id === id);
      if (!item) return;
      item.epState = item.epState === 'watching' ? 'finished' : 'watching';
      await persistItem({ ...item });
    };

      const watchingCount = items.filter(i => i.status === 'watching').length;

      document.getElementById('statBooks').innerText = booksCount;

    // Render Table Rows
    function render() {
      updateStats();

      const tbody = document.getElementById('mediaTableBody');
      const emptyState = document.getElementById('emptyState');
      const searchVal = document.getElementById('searchInput').value.trim().toLowerCase();
      const statusFilter = document.getElementById('statusFilter').value;
      const platformFilter = document.getElementById('platformFilter').value;
      const subTypeFilter = document.getElementById('subTypeFilter').value;

      // Filtering logic
      const filtered = items.filter(item => {
        // Category filter
        if (activeCategoryFilter !== 'all' && item.category !== activeCategoryFilter) return false;
        // Sub-Type filter (日劇/美劇/台劇/動畫/其它)
        if (subTypeFilter !== 'all' && item.subType !== subTypeFilter) return false;
        // Status filter
        if (statusFilter !== 'all' && item.status !== statusFilter) return false;
        // Platform filter
        if (platformFilter !== 'all' && item.platform !== platformFilter) return false;
        // Search text
        if (searchVal) {
          const matchTitle = (item.title || '').toLowerCase().includes(searchVal);
          const matchNotes = (item.notes || '').toLowerCase().includes(searchVal);
          const matchPlatform = (item.platform || '').toLowerCase().includes(searchVal);
          if (!matchTitle && !matchNotes && !matchPlatform) return false;
        }
        return true;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');

      tbody.innerHTML = filtered.map(item => {
        const platInfo = platformConfig[item.platform] || platformConfig['其他'];
        const isManga = item.category === 'manga';
        const unit = isManga ? '話/卷' : '集';
        const total = parseInt(item.totalEp, 10) || 0;
        const current = parseInt(item.currentEp, 10) || 0;

        // SubType Badge for drama
        let subBadge = '';
        if (!isManga && item.subType && subTypeConfig[item.subType]) {
          const subInfo = subTypeConfig[item.subType];
          subBadge = `<span class="inline-flex items-center px-1.5 py-0.5 rounded border text-[10px] font-medium ${subInfo.bg} ${subInfo.text} ${subInfo.border}">${subInfo.label}</span>`;
        } else if (isManga) {
          subBadge = `<span class="inline-flex items-center px-1.5 py-0.5 rounded border text-[10px] font-medium bg-purple-950/50 text-purple-300 border-purple-800/40">漫畫/書籍</span>`;
        }

        // Calculate progress percentage
        let percentage = 0;
        if (total > 0) {
          percentage = Math.min(100, Math.round((current / total) * 100));
        }

        // Overall status badge
        let statusBadge = '';
        if (item.status === 'completed') {
          statusBadge = `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-medium bg-emerald-950 text-emerald-400 border border-emerald-800"><i class="ph ph-check"></i>已完結</span>`;
        } else if (item.status === 'dropped') {
          statusBadge = `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-medium bg-zinc-800 text-zinc-400 border border-zinc-700"><i class="ph ph-pause"></i>棄坑/暫停</span>`;
        } else {
          statusBadge = `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-medium bg-sky-950 text-sky-400 border border-sky-800"><i class="ph ph-play"></i>進行中</span>`;
        }

        // Current episode viewing state
        const isEpWatching = item.epState === 'watching';
        const epStateHtml = `
          <button onclick="toggleEpisodeState('${item.id}')" 
                  title="點擊切換該集完成度"
                  class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-[11px] font-medium transition cursor-pointer ${
                    isEpWatching 
                      ? 'bg-amber-950/80 text-amber-300 border border-amber-800 hover:bg-amber-900/60' 
                      : 'bg-emerald-950/80 text-emerald-300 border border-emerald-800 hover:bg-emerald-900/60'
                  }">
            <span class="w-1.5 h-1.5 rounded-full ${isEpWatching ? 'bg-amber-400 animate-pulse' : 'bg-emerald-400'}"></span>
            <span>第 ${current} ${unit}${isEpWatching ? ' 進行中' : ' 已看完'}</span>
          </button>
        `;

        return `
          <tr class="hover:bg-zinc-800/40 transition-colors">
            <!-- Platform & Category -->
            <td class="py-2.5 px-3">
              <div class="flex flex-col gap-1 items-start">
                <span class="inline-flex items-center px-2 py-0.5 rounded border text-[11px] font-medium ${platInfo.bg} ${platInfo.text} ${platInfo.border}">
                  ${item.platform}
                </span>
                <div>${subBadge}</div>
              </div>
            </td>

            <!-- Name / Title -->
            <td class="py-2.5 px-3">
              <div class="font-semibold text-zinc-100 text-sm tracking-tight truncate max-w-xs" title="${item.title}">
                ${escapeHtml(item.title)}
              </div>
              <div class="text-[11px] text-zinc-500 mt-0.5 truncate max-w-xs">
                ${item.notes ? escapeHtml(item.notes) : '無特別備註'}
              </div>
            </td>

            <!-- Overall Status -->
            <td class="py-2.5 px-3 text-center">
              ${statusBadge}
            </td>

            <!-- Episode Progress & Bar -->
            <td class="py-2.5 px-3">
              <div class="flex items-center justify-between text-[11px] mb-1 font-mono text-zinc-300">
                <span>目前: <b class="text-sky-400 text-xs">${current}</b> ${unit}</span>
                <span>${total > 0 ? `總共 ${total} ${unit} (${percentage}%)` : '總數未定'}</span>
              </div>
              <div class="w-full bg-zinc-800 rounded-full h-1.5 overflow-hidden">
                <div class="bg-gradient-to-r from-sky-500 to-indigo-500 h-1.5 rounded-full transition-all duration-300" style="width: ${total > 0 ? percentage : (current > 0 ? 100 : 0)}%"></div>
              </div>
            </td>

            <!-- Episode Sub-status -->
            <td class="py-2.5 px-3 text-center">
              ${epStateHtml}
            </td>

            <!-- Note / Tags -->
            <td class="py-2.5 px-3">
              <div class="text-xs text-zinc-400 line-clamp-2" title="${escapeHtml(item.notes || '')}">
                ${item.notes ? escapeHtml(item.notes) : '<span class="text-zinc-600">-</span>'}
              </div>
            </td>

            <!-- Quick Action Buttons -->
            <td class="py-2.5 px-3 text-right pr-4">
              <div class="flex items-center justify-end gap-1">
                <button onclick="adjustEpisode('${item.id}', -1)" title="減 1 集/話" class="w-7 h-7 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-200 border border-zinc-700 flex items-center justify-center transition active:scale-90">
                  <i class="ph ph-minus text-xs"></i>
                </button>
                <button onclick="adjustEpisode('${item.id}', 1)" title="加 1 集/話" class="w-7 h-7 rounded-lg bg-sky-600/30 hover:bg-sky-600 text-sky-300 hover:text-white border border-sky-500/40 flex items-center justify-center transition active:scale-90 font-bold">

                </button>
              </div>

        `;
      }).join('');

    // Modal Helpers
    function openModal() {
      document.getElementById('itemModal').classList.remove('hidden');
      document.getElementById('itemModal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('itemModal').classList.remove('flex');
      document.getElementById('itemModal').classList.add('hidden');
      document.getElementById('itemForm').reset();
      document.getElementById('editItemId').value = '';
    }

    // Safe string escape
    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }

    // Event Listeners Registration
    document.addEventListener('DOMContentLoaded', () => {
      // Connect to Firestore or load local cache
      initFirebase();

      // Category tabs filter
      document.querySelectorAll('.filter-cat-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.filter-cat-btn').forEach(b => {
            b.classList.remove('bg-zinc-700', 'text-white');
            b.classList.add('text-zinc-400');
          });
          e.currentTarget.classList.add('bg-zinc-700', 'text-white');
          e.currentTarget.classList.remove('text-zinc-400');
          activeCategoryFilter = e.currentTarget.getAttribute('data-cat');
          render();
        });
      });

      // Category input change listener in modal
      document.getElementById('inputCategory').addEventListener('change', (e) => {
        toggleCategoryInputs(e.target.value);
      });

      // Filter Inputs
      document.getElementById('subTypeFilter').addEventListener('change', render);
      document.getElementById('statusFilter').addEventListener('change', render);
      document.getElementById('platformFilter').addEventListener('change', render);
      document.getElementById('searchInput').addEventListener('input', render);

      // Open Add Modal
      document.getElementById('btnOpenAddModal').addEventListener('click', () => {
        document.getElementById('itemForm').reset();
        document.getElementById('editItemId').value = '';
        toggleCategoryInputs('video');
        document.getElementById('modalTitle').innerHTML = '<i class="ph ph-plus-circle text-sky-400"></i><span>新增追蹤項目</span>';
        openModal();
      });

      document.getElementById('btnCloseModal').addEventListener('click', closeModal);
      document.getElementById('btnCancelModal').addEventListener('click', closeModal);

      // Form Submit (Create or Edit)
      document.getElementById('itemForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('editItemId').value || 'item-' + Date.now();
        const title = document.getElementById('inputTitle').value.trim();
        const category = document.getElementById('inputCategory').value;
        const subType = category === 'manga' 
          ? document.getElementById('inputMangaType').value 
          : document.getElementById('inputSubType').value;
        const platform = document.getElementById('inputPlatform').value;
        const currentEp = parseInt(document.getElementById('inputCurrentEp').value, 10) || 0;
        const totalEpVal = document.getElementById('inputTotalEp').value;
        const totalEp = totalEpVal !== '' ? parseInt(totalEpVal, 10) : 0;
        const epState = document.getElementById('inputEpState').value;
        const status = document.getElementById('inputStatus').value;
        const notes = document.getElementById('inputNotes').value.trim();

        const newItem = {
          id,
          title,
          category,
          subType,
          platform,
          currentEp,
          totalEp,
          epState,
          status,
          notes
        };

        closeModal();
        await persistItem(newItem);
      });

      // Delete Dialog
      document.getElementById('btnCancelDelete').addEventListener('click', () => {
        itemToDelete = null;
        document.getElementById('deleteModal').classList.add('hidden');
        document.getElementById('deleteModal').classList.remove('flex');
      });

      document.getElementById('btnConfirmDelete').addEventListener('click', async () => {
        if (itemToDelete) {
          await removeItem(itemToDelete);
          itemToDelete = null;
          document.getElementById('deleteModal').classList.add('hidden');
          document.getElementById('deleteModal').classList.remove('flex');
        }
      });

      // Firebase Modal
      const fbModal = document.getElementById('firebaseModal');
      document.getElementById('btnOpenFirebaseSettings').addEventListener('click', () => {
        const raw = localStorage.getItem('fb_credentials');
        if (raw) {
          try {
            const conf = JSON.parse(raw);
            document.getElementById('fbApiKey').value = conf.apiKey || '';
            document.getElementById('fbAuthDomain').value = conf.authDomain || '';
            document.getElementById('fbProjectId').value = conf.projectId || '';
            document.getElementById('fbStorageBucket').value = conf.storageBucket || '';
            document.getElementById('fbAppId').value = conf.appId || '';
          } catch(e) {}
        }
        fbModal.classList.remove('hidden');
        fbModal.classList.add('flex');
      });

      document.getElementById('btnCloseFirebaseModal').addEventListener('click', () => {
        fbModal.classList.add('hidden');
        fbModal.classList.remove('flex');
      });
      document.getElementById('btnCancelFirebase').addEventListener('click', () => {
        fbModal.classList.add('hidden');
        fbModal.classList.remove('flex');
      });

      document.getElementById('firebaseForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const conf = {
          apiKey: document.getElementById('fbApiKey').value.trim(),
          authDomain: document.getElementById('fbAuthDomain').value.trim(),
          projectId: document.getElementById('fbProjectId').value.trim(),
          storageBucket: document.getElementById('fbStorageBucket').value.trim(),
          appId: document.getElementById('fbAppId').value.trim()
        };

        if (!conf.apiKey || !conf.projectId) {
          showToast('請填寫至少 API Key 與 Project ID', 'error');
          return;
        }

        localStorage.setItem('fb_credentials', JSON.stringify(conf));
        fbModal.classList.add('hidden');
        fbModal.classList.remove('flex');
        showToast('已更新 Firebase 設定，重新連線中...');
        initFirebase();
      });

      document.getElementById('btnClearFirebase').addEventListener('click', () => {
        localStorage.removeItem('fb_credentials');
        fbModal.classList.add('hidden');
        fbModal.classList.remove('flex');
        firestoreDb = null;
        if (unsubscribeFirestore) unsubscribeFirestore();
        document.getElementById('syncIndicator').className = 'w-2 h-2 rounded-full bg-zinc-500';
        document.getElementById('syncIndicator').title = '使用本地儲存模式';
        showToast('已清除 Firebase 配置，切換為本地離線模式');
        loadLocalItems();
      });
    });
  </script>
</body>
</html>
